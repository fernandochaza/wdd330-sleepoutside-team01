<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <header class="divider" id="header"></header>
    <div id="alert-container"></div>
    <main class="divider">
      <div class="hero">
        <img
          src="./public/images/banner-sm.jpg"
          srcset="./public/images/banner-sm.jpg 500w, ./public/images/banner.jpg 1000w"
          alt="image of a high mountain lake"
        />
      </div>
        <div class="logo logo--square">
          <img src="./public/images/noun_Tent_2517.svg" alt="tent image for logo" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </div>

      <section class="categories">
        <div class="category-list">
          <div class="category">
            <a href="product_listing/index.html?category=tents">
              <img
                src="./public/images/category-tents.svg"
                alt="Tents category image"
              />
              <p>Tents</p>
            </a>
          </div>

          <div class="category">
            <a href="product_listing/index.html?category=backpacks">
              <img
                src="./public/images/category-backpacks.svg"
                alt="Backpack category image"
              />
              <p>BackPacks</p>
            </a>
          </div>

          <div class="category">
            <a href="product_listing/index.html?category=sleeping-bags">
              <img
                src="./public/images/category-sleepingbags.svg"
                alt="Sleeping bags category image"
              />
              <p>Sleeping Bags</p>
            </a>
          </div>

          <div class="category">
            <a href="product_listing/index.html?category=hammocks">
              <img
                src="./public/images/category-hammocks.svg"
                alt="Hammocks category image"
              />
              <p>Hammocks</p>
            </a>
          </div>
        </div>
      </section>
    </main>
    <form id="searchForm">
      <input type="text" id="searchInput" placeholder="Search products..." />
      <button type="submit">Search</button>
    </form>
    <div id="productList"></div>
    <footer>
      &copy;2025 ⛺ SleepOutside ⛺ WDD 330 ⛺ BYU-Idaho for BYU-Pathway
      Worldwide Online
    </footer>
    <footer id="footer"></footer>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
